# PvP section
type PvPToken @entity {
  id: Bytes! # address
  symbol: String!
  name: String!
  decimals: Int!

  wagerAndJoinTxnCount: BigInt! # [NEW] Number of wager & join txns
  seatCount: BigInt! # [NEW] Sum of all bought seats
  uniqueBets: BigInt!
  userCount: BigInt! # [UPDATE]
  totalWagered: BigInt! # [UPDATE]
  totalPayout: BigInt! # [UPDATE]

  dividendAmount: BigInt!
  treasuryAmount: BigInt!
  teamAmount: BigInt!
  initiatorAmount: BigInt!
  affiliateAmount: BigInt! # [NEW]
}

