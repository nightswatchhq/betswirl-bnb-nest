}

type WeightedGameConfig @entity(immutable:true) { # [NEW]
  # From GameConfigAdded event
  id: ID!
  creator: User!
  creationTimestamp: BigInt!
  multipliers: [BigInt!]!
  weights: [BigInt!]!
  weightedGameId: BigInt! # ID use on chain to separate weighted games (1, 2, etc)
  gameId: String! # ID use off-chain to identify weighted games (WHEEL, PLINKO, etc)
  EV: BigDecimal!

  bets: [WeightedGameBet!]! @derivedFrom(field: "config")
}

