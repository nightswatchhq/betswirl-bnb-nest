type Bet @entity { # [NEW] It replaces DiceBet, CoinTossBet, KenoBet & RouletteBet
  # From PlaceBet event
  id: ID!
  gameId: String! # [NEW]
  gameAddress: Bytes! # [NEW]
  user: User!
  gameToken: GameToken!
  affiliate: Affiliate # [NEW]
  inputValue: BigInt! # [NEW] It replaces cap, face & numbers
  betAmount: BigInt # [UPDATE] previously "amount". From Roll event for v1 abi games
  betCount: BigInt! # [NEW]
  stopLoss: BigInt! # [NEW]
  stopGain: BigInt! # [NEW]
  houseEdge: Int! # [UPDATE] compulsory + set when PlaceBet event is received now
  betTimestamp: BigInt! # [UPDATE]
  resolved: Boolean!
  refunded: Boolean! # [NEW]
  chargedVRFFees: BigInt! # [NEW] ETH value, only used since V5 abi games
  betTxnHash: Bytes!

  # From PlaceFreeBet event
  isFreebet: Boolean! # [NEW]
  freebetId: BigInt # [NEW]

  # From Roll event
  totalBetAmount: BigInt # [NEW]
  payout: BigInt
  payoutMultiplier: BigDecimal # [NEW]
  rollTxnHash: Bytes
  rolled: [BigInt!] # [UPDATE] It is now an array
  rollTimestamp: BigInt # [NEW]

  # From RandomWordsFulfilled event
  consumedNativeVRFFees: BigInt # [NEW] ETH value, only used since V5 abi games
  consumedLinkVRFFees: BigInt # [NEW] LINK value, only used since V5 abi games

  #Links to potential bet configs
  kenoBet: KenoBet @derivedFrom(field: "bet")
  weightedGameBet: WeightedGameBet @derivedFrom(field: "bet")
}

