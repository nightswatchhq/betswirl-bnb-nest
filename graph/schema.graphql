  totalFreebetCount: BigInt!
  bets: [Bet!]! @derivedFrom(field: "affiliate")
  affiliatedGames: [AffiliateGame!]! @derivedFrom(field: "affiliate")
  affiliatedTokens: [AffiliateToken!]! @derivedFrom(field: "affiliate")
  affiliatedGameTokens: [AffiliateGameToken!]! @derivedFrom(field: "affiliate")
  affiliatedUserTokens: [AffiliateUserToken!]! @derivedFrom(field: "affiliate")
  affiliatedUserGames: [AffiliateUserGame!]! @derivedFrom(field: "affiliate")

  # PvP section
  wagerAndJoinTxnCount: BigInt! # [NEW] Number of wager & join txns
  seatCount: BigInt! # [NEW] Sum of all bought seats
  winSeatCount: BigInt! # [NEW] Sum of all won seats
  pvpBets: [PvPBet!]! @derivedFrom(field: "affiliate")
  pvpAffiliatedTokens: [PvPAffiliateToken!]! @derivedFrom(field: "affiliate")
  pvpAffiliatedGameTokens: [PvPAffiliateGameToken!]! @derivedFrom(field: "affiliate")
  pvpAffiliatedUserTokens: [PvPAffiliateUserToken!]! @derivedFrom(field: "affiliate")

  # Leaderboard section
