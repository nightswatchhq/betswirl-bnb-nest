  maxPayout: BigInt!
}

type PvPBet @entity { # [NEW] Common base between RussianRouletteBet & CoinTossBattleBet
  id: ID! # "gameAddress-betId"
  betId: BigInt! # [NEW]
  user: User!
  gameId: String! # [NEW]
  gameToken: PvPGameToken!
  gameAddress: Bytes! # [NEW]
  affiliate: Affiliate! # [NEW]

  betTimestamp: BigInt! # [UPDATE]
  resolved: Boolean!
  canceled: Boolean! # [UPDATE]
  refunded: Boolean! # [UPDATE]

  # From PlaceBet event
  betAmount: BigInt! # [UPDATE] previously "amount"
  opponents: [Bytes!]!
  houseEdge: Int!
  chargedVRFFees: BigInt! # [NEW] ETH value, only used since V2 PvP abi games


  # From Joined event
  seats: [Bytes!]!
  joinTxns: [PvPGameJoinTransaction!]! @derivedFrom(field: "bet")
  pot: BigInt!

  # From BetLaunched event
  betLaunchedTxnHash: Bytes # [UPDATE]
  betLaunchedTimestamp: BigInt # [NEW]
  vrfRequest: PvPVRFRequest # [NEW] only used since V2 PvP abi games

  # From Roll event
  payout: BigInt
  rollTxnHash: Bytes
  rollTimestamp: BigInt # [UPDATE]

  # From RandomWordsFulfilled event
  consumedNativeVRFFees: BigInt # [NEW] ETH value, only used since V2 PvP abi games
  consumedLinkVRFFees: BigInt # [NEW] LINK value, only used since V2 PvP abi games
}

