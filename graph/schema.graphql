  affiliateToken: PvPAffiliateToken!

  wagerAndJoinTxnCount: BigInt!
  seatCount: BigInt!
  winSeatCount: BigInt!
  totalWagered: BigInt!
  totalPayout: BigInt!
}

type PvPAffiliateGameToken @entity { # [NEW]
  id: ID! # `AFFILIATE-GAME-TOKEN`
  affiliate: Affiliate!
  game: String!
  affiliateToken: PvPAffiliateToken!

  wagerAndJoinTxnCount: BigInt!
  seatCount: BigInt!
  winSeatCount: BigInt!
  totalWagered: BigInt!
  totalPayout: BigInt!
  totalEarned: BigInt!
  houseEdge: Int
}

# Leaderboard section

type LeaderboardToken @entity(immutable:true) {
  id: Bytes! # address
  symbol: String!
  name: String!
  decimals: Int!

  leaderboards: [Leaderboard!]! @derivedFrom(field: "token")
  leaderboardAffiliatedTokens: [LeaderboardAffiliateToken!]! @derivedFrom(field: "token")
}

enum LeaderboardStatus {
  Created
  #PENDING => startsAt is not on chain
  #ENDED => calculated status
  Finalized
  #EXPIRED => calculated status
  Canceled
}

type Leaderboard @entity {
  id: ID!
  affiliate: Affiliate!
  token: LeaderboardToken!
  leaderboardAffiliateToken: LeaderboardAffiliateToken!
  winners: [Bytes!]
  endTimestamp: BigInt!
  expirationTime: BigInt!
  shares: [BigInt!]!
  claimedShares: [BigInt!]!
  totalShares: BigInt!
  status: LeaderboardStatus!

  totalClaimedShares: BigInt!
  totalUnclaimedShares: BigInt! # = shares not claimed by the winners AND claimed by the affiliate
}

type LeaderboardAffiliateToken @entity {
  id: ID! # `AFFILIATE-LEADERBOARDTOKEN`
  affiliate: Affiliate!
  token: LeaderboardToken!

  totalSharesDistributed: BigInt!
  totalSharesClaimed: BigInt!
  totalLeaderboards: BigInt!

  leaderboards: [Leaderboard!] @derivedFrom(field: "leaderboardAffiliateToken")
  leaderboardAffiliateUserTokens: [LeaderboardAffiliateUserToken!] @derivedFrom(field: "leaderboardAffiliateToken")

}

type LeaderboardAffiliateUser @entity {
  id: ID! # `AFFILIATE-USER`
  affiliate: Affiliate!
  user: User!

  totalLeaderboardsWonCount: BigInt!

  leaderboardAffiliateUserTokens: [LeaderboardAffiliateUserToken!] @derivedFrom(field: "leaderboardAffiliateUser")
}

type LeaderboardAffiliateUserToken @entity {
    id: ID! # `AFFILIATE-USER-LEADERBOARDTOKEN`
  affiliate: Affiliate!
  leaderboardAffiliateUser: LeaderboardAffiliateUser!
  leaderboardAffiliateToken: LeaderboardAffiliateToken!

  totalLeaderboardSharesWon: BigInt!
  totalLeaderboardSharesClaimed: BigInt!
}

