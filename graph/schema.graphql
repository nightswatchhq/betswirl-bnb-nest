  leaderboardAffiliatedUsers: [LeaderboardAffiliateUser!]! @derivedFrom(field: "affiliate")
  leaderboardAffiliatedUserTokens: [LeaderboardAffiliateUserToken!]! @derivedFrom(field: "affiliate")
  leaderboardAffiliatedTokens: [LeaderboardAffiliateToken!]! @derivedFrom(field: "affiliate")

  # Day data section
