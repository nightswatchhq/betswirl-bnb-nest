# Removed UserTokenDayData & UserOverchargedVRFCost

# Common section
type Store @entity {
  id: ID! # 0
  # PvH section
  betTxnCount: BigInt! # [UPDATE] Total number of bet txs
  betCount: BigInt! # [NEW] Sum of betCount

  # PvP section
  wagerAndJoinTxnCount: BigInt! # [NEW] Number of wager & join txns
  seatCount: BigInt! # [NEW] Sum of all bought seats

  #Common section
  affiliateCount: BigInt! # [NEW] Total number of unique affiliate
  userCount: BigInt! # [NEW] Total number of unique users
}

type User @entity {
  id: Bytes! # `ACCOUNT`

  # Common section
  firstBetTimestamp: BigInt
  lastBetTimestamp: BigInt
  totalChargedVRFFees: BigInt! # [NEW] ETH value. Only used since V5 abi PvH games and v2 PvP games
  consumedNativeVRFFees: BigInt! # [NEW] ETH value. Only used since V5 abi PvH games and v2 PvP games
  consumedLinkVRFFees: BigInt! # [NEW] ETH value. Only used since V5 abi PvH games and v2 PvP games

  # PvH section
  betTxnCount: BigInt! # [NEW] Number of bet txs
  betCount: BigInt! # [NEW] Sum of betCount
  winTxnCount: BigInt! # [NEW] Number of won bet txs
  maxMultiplier: BigDecimal! # [NEW]
  userTokens: [UserToken!]! @derivedFrom(field: "user")
  userGameTokens: [UserGameToken!]! @derivedFrom(field: "user")
  bets: [Bet!]! @derivedFrom(field: "user") # [NEW] It replaces DiceBets, CoinTossBets, RouletteBets, KenoBets

  #PvP section
  wagerAndJoinTxnCount: BigInt! # [NEW] Number of wager & join txns
  seatCount: BigInt! # [NEW] Sum of all bought seats
  winSeatCount: BigInt! # [NEW] Sum of all won seats
  pvpMaxMultiplier: BigDecimal! # [NEW]
  pvpUserTokens: [PvPUserToken!]! @derivedFrom(field: "user")  # [NEW]
  pvpUserGameTokens: [PvPUserGameToken!]! @derivedFrom(field: "user")  # [NEW]
  pvpBets: [PvPBet!]! @derivedFrom(field: "user") # [NEW] It replaces RussianRouletteBets & CointossBattleBets

  leaderboardAffiliatedUsers: [LeaderboardAffiliateUser!]! @derivedFrom(field: "user")

}

type Affiliate @entity { # [NEW]
